name: Java CI (Gradle)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build

      - name: Upload server plugin
        uses: actions/upload-artifact@v4
        with:
          name: server-plugin
          path: server-plugin/build/libs/*.jar

      - name: Upload client mod
        uses: actions/upload-artifact@v4
        with:
          name: client-fabric
          path: client-fabric/build/libs/*.jar