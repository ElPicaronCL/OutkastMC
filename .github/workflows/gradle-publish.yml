name: Java CI (Gradle)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build
      - name: Debug - list files
        run: |
          echo "=== SERVER ==="
          ls -R server/build || true
          echo "=== CLIENT ==="
          ls -R client/build || true
    
      - name: Upload server plugin
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: server/build/libs/*.jar

      - name: Upload client mod
        uses: actions/upload-artifact@v4
        with:
          name: client
          path: client/build/libs/*.jar